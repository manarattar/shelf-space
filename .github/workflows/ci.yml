name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[app,train,dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Fast tests (optimiser, experiment, forecast metrics, app smoke test)
        run: pytest -q -m "not spark"
      - name: Spark pipeline tests and forecast quality gate (model must beat the baseline)
        run: pytest -q -m spark

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shelf-space .
